services:
  mastery-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mastery_pedagogical_engine
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-mastery-ai_prod_jwt_secret_key_minimum_32_characters_hmac}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TTS_MODEL=${GEMINI_TTS_MODEL:-gemini-2.0-flash}
      - GEMINI_VIDEO_MODEL=${GEMINI_VIDEO_MODEL:-}
      - TEACHER_INVITE_CODE=${TEACHER_INVITE_CODE:-FACULTY2026}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
